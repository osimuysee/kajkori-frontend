<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KajKori - এলাকা অনুযায়ী সহজ সার্ভিস</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <header class="sticky top-0 bg-white shadow-md z-50 border-b">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
            <a href="index.html" class="text-2xl font-bold text-blue-700 flex items-center gap-2">
                <i class="fa-solid fa-briefcase text-orange-500"></i> কাজকরি (KajKori)
            </a>

            <div class="flex items-center gap-2 md:gap-3">
                <a href="index.html" class="text-gray-700 hover:text-blue-700 font-bold text-sm px-3 py-2 rounded-lg transition hover:bg-gray-100 flex items-center gap-1.5">
                    <i class="fa-solid fa-house text-blue-600"></i> হোম
                </a>

                <!-- লগআউট অবস্থায় দেখাবে -->
                <div id="loggedOutNav" class="flex items-center gap-2">
                    <a href="login.html" class="text-gray-700 hover:text-blue-700 font-bold text-sm px-3 py-2 rounded-lg transition border border-gray-200 hover:border-blue-500 flex items-center gap-1.5">
                        <i class="fa-solid fa-right-to-bracket text-blue-600"></i> লগইন
                    </a>
                    <a href="register.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm px-4 py-2 rounded-lg transition shadow-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-user-plus"></i> কর্মী হিসেবে যোগ দিন
                    </a>
                </div>

                <!-- লগইন অবস্থায় দেখাবে -->
                <div id="loggedInNav" class="hidden items-center gap-2">
                    <a href="profile.html" class="text-xs font-bold text-blue-800 bg-blue-50 border border-blue-200 px-3 py-2 rounded-lg hover:bg-blue-100" id="userDisplayName"></a>
                    <button onclick="logoutUser()" class="bg-red-600 hover:bg-red-700 text-white font-bold text-sm px-3 py-2 rounded-lg transition shadow-sm flex items-center gap-1">
                        <i class="fa-solid fa-right-from-bracket"></i> লগআউট
                    </button>
                </div>

                <!-- এডমিন বাটন (ডিফল্টভাবে হিডেন থাকবে) -->
                <a id="adminNavBtn" href="admin.html" class="hidden bg-gray-800 hover:bg-gray-900 text-white font-bold text-sm px-3 py-2 rounded-lg transition shadow-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-user-gear"></i> এডমিন
                </a>
            </div>
        </div>
    </header>

    <main class="flex-grow">
        <section class="bg-gradient-to-b from-blue-50 to-white py-12 px-4 border-b">
            <div class="max-w-4xl mx-auto text-center">
                <h1 class="text-2xl md:text-4xl font-bold text-gray-900 leading-tight">
                    আপনার নিজস্ব এলাকায় অভিজ্ঞ কর্মীর সেবা নিন
                </h1>
                <p class="text-gray-600 mt-2 text-sm md:text-base">
                    কাজের ধরন ও এলাকা নির্বাচন করে সহজেই অনুমোদিত কর্মী খুঁজে নিন
                </p>

                <form id="searchForm" class="mt-8 bg-white p-6 rounded-2xl shadow-xl border border-gray-200 text-left space-y-4">
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">কাজের ধরন (ক্যাটাগরি)</label>
                            <select id="jobCategory" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="">সকল ক্যাটাগরি</option>
                                <option value="electrician">⚡ ইলেকট্রিশিয়ান (Electrician)</option>
                                <option value="plumber">🚰 প্লাম্বার / পাইপ মিস্ত্রি (Plumber)</option>
                                <option value="ac_repair">❄️ এসি / ফ্রিজ সার্ভিসিং</option>
                                <option value="painter">🎨 রং মিস্ত্রি (Painter)</option>
                                <option value="carpenter">🪑 কাঠ মিস্ত্রি (Carpenter)</option>
                                <option value="tiles_mason">🧱 রাজমিস্ত্রি / টাইস মিস্ত্রি</option>
                                <option value="cleaner">🧹 পরিচ্ছন্নতা কর্মী (Cleaner)</option>
                                <option value="cook">🍳 বাবুর্চি (Cook)</option>
                                <option value="driver">🚗 ড্রাইভার (Driver)</option>
                                <option value="tutor">📚 হোম টিউটর</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">কীওয়ার্ড / নাম</label>
                            <input type="text" id="searchKeyword" placeholder="যেমন: রহিম, ইলেকট্রিক" class="w-full p-2.5 bg-gray-50 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div class="border-t pt-4">
                        <p class="text-xs font-bold text-blue-700 uppercase tracking-wide mb-3"><i class="fa-solid fa-location-dot"></i> লোকেশন</p>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <div>
                                <select id="division" class="w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-xs md:text-sm outline-none">
                                    <option value="">বিভাগ সিলেক্ট করুন</option>
                                    <option value="dhaka">ঢাকা</option>
                                    <option value="chittagong">চট্টগ্রাম</option>
                                    <option value="rajshahi">রাজশাহী</option>
                                    <option value="khulna">খুলনা</option>
                                    <option value="barisal">বরিশাল</option>
                                    <option value="sylhet">সিলেট</option>
                                    <option value="rangpur">রংপুর</option>
                                    <option value="mymensingh">ময়মনসিংহ</option>
                                </select>
                            </div>
                            <div>
                                <select id="district" class="w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-xs md:text-sm outline-none">
                                    <option value="">জেলা সিলেক্ট করুন</option>
                                </select>
                            </div>
                            <div>
                                <select id="upazila" class="w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-xs md:text-sm outline-none">
                                    <option value="">উপজেলা সিলেক্ট করুন</option>
                                </select>
                            </div>
                            <div>
                                <input type="text" id="village" placeholder="গ্রাম / মহল্লা" class="w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-xs md:text-sm outline-none">
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg text-base shadow-md transition flex items-center justify-center gap-2 mt-4">
                        <i class="fa-solid fa-magnifying-glass"></i> ডাটাবেজে কর্মী খুঁজুন
                    </button>
                </form>
            </div>
        </section>

        <section id="resultsSection" class="py-12 px-4 max-w-5xl mx-auto hidden">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">অনুমোদিত কর্মীদের তালিকা</h2>
            <div id="resultsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-6 px-4 text-center text-xs border-t border-gray-800 mt-auto">
        <p class="text-white font-bold text-sm mb-1">কাজকরি (KajKori)</p>
        <p>© ২০২৬ KajKori. সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <script src="locations.js"></script>
    <script src="script.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCXD9-SYAqnmatYe81M9wBeSB4wjJGFAZQ",
            authDomain: "kajkori-8a07e.firebaseapp.com",
            databaseURL: "https://kajkori-8a07e-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kajkori-8a07e",
            storageBucket: "kajkori-8a07e.firebasestorage.app",
            messagingSenderId: "594029245687",
            appId: "1:594029245687:web:d2364820ce6be9d4104ff2"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ⚠️ আপনার আসল এডমিন ইমেইলটি এখানে বসিয়ে দিন
        const ADMIN_EMAIL = "apurboantor3@gmail.com";

        // ইউজার লগইন ও এডমিন স্ট্যাটাস চেক
        auth.onAuthStateChanged(user => {
            const loggedOutNav = document.getElementById('loggedOutNav');
            const loggedInNav = document.getElementById('loggedInNav');
            const adminNavBtn = document.getElementById('adminNavBtn');
            const userDisplayName = document.getElementById('userDisplayName');

            if (user) {
                if (loggedOutNav) loggedOutNav.classList.add('hidden');
                if (loggedInNav) loggedInNav.classList.add('flex');
                if (loggedInNav) loggedInNav.classList.remove('hidden');
                if (userDisplayName) userDisplayName.innerText = user.displayName || user.email || user.phoneNumber || "ইউজার";

                // এডমিন ইমেইল মিললে বাটন আনহাইড হবে
                if (user.email === ADMIN_EMAIL) {
                    if (adminNavBtn) adminNavBtn.classList.remove('hidden');
                } else {
                    if (adminNavBtn) adminNavBtn.classList.add('hidden');
                }
            } else {
                if (loggedOutNav) loggedOutNav.classList.remove('hidden');
                if (loggedInNav) loggedInNav.classList.remove('flex');
                if (loggedInNav) loggedInNav.classList.add('hidden');
                if (adminNavBtn) adminNavBtn.classList.add('hidden');
            }
        });

        function logoutUser() {
            auth.signOut().then(() => {
                alert("আপনি সফলভাবে লগআউট করেছেন।");
                window.location.reload();
            });
        }

        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const category = document.getElementById('jobCategory').value;
            const division = document.getElementById('division').value;
            const district = document.getElementById('district').value;
            const upazila = document.getElementById('upazila').value;
            const village = document.getElementById('village').value.trim().toLowerCase();
            const keyword = document.getElementById('searchKeyword').value.trim().toLowerCase();

            const resultsSection = document.getElementById('resultsSection');
            const resultsGrid = document.getElementById('resultsGrid');
            
            resultsSection.classList.remove('hidden');
            resultsGrid.innerHTML = `<div class="col-span-full text-center py-8 text-gray-500 font-bold"><i class="fa-solid fa-spinner fa-spin text-xl text-blue-600"></i><br>কর্মী খোঁজা হচ্ছে...</div>`;

            try {
                let query = db.collection("workers").where("status", "==", "approved");

                if (category) query = query.where("category", "==", category);
                if (division) query = query.where("division", "==", division);
                if (district) query = query.where("district", "==", district);
                if (upazila) query = query.where("upazila", "==", upazila);

                const snapshot = await query.get();
                resultsGrid.innerHTML = '';

                let count = 0;
                snapshot.forEach(doc => {
                    const worker = doc.data();
                    
                    if (keyword && !(worker.fullName || '').toLowerCase().includes(keyword) && !(worker.category || '').toLowerCase().includes(keyword)) {
                        return;
                    }

                    if (village && !(worker.village || '').toLowerCase().includes(village)) {
                        return;
                    }

                    count++;
                    const photo = escapeHtml(worker.profileImageUrl || 'https://via.placeholder.com/150');
                    const phone = escapeHtml(worker.phone || '');
                    resultsGrid.innerHTML += `
                        <div class="bg-white p-5 rounded-xl border shadow-sm hover:shadow-md transition flex flex-col justify-between">
                            <div>
                                <div class="flex items-center gap-3 mb-3">
                                    <img src="${photo}" class="w-14 h-14 rounded-full object-cover border" alt="Profile">
                                    <div>
                                        <h3 class="font-bold text-base text-gray-900">${escapeHtml(worker.fullName || 'নাম নেই')}</h3>
                                        <span class="bg-blue-100 text-blue-800 text-[11px] px-2 py-0.5 rounded font-bold capitalize">${escapeHtml(worker.category || 'N/A')}</span>
                                    </div>
                                </div>
                                <p class="text-xs text-gray-600 mb-1"><i class="fa-solid fa-location-dot text-red-500"></i> ${worker.village ? escapeHtml(worker.village) + ', ' : ''}${escapeHtml(worker.upazila || '')}, ${escapeHtml(worker.district || '')}</p>
                                <p class="text-xs font-bold text-green-600 mb-4">চার্জ: ৳ ${escapeHtml(worker.perTaskCharge || '০')}</p>
                            </div>
                            <a href="tel:${phone}" class="block text-center bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded-lg text-sm transition">
                                <i class="fa-solid fa-phone"></i> ${phone}
                            </a>
                        </div>
                    `;
                });

                if (count === 0) {
                    resultsGrid.innerHTML = `<div class="col-span-full text-center py-8 text-gray-500 font-bold">কোনো অনুমোদিত কর্মী পাওয়া যায়নি।</div>`;
                }

                resultsSection.scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                console.error(err);
                resultsGrid.innerHTML = `<div class="col-span-full text-center py-8 text-red-500 font-bold">ডাটা আনতে সমস্যা হয়েছে: ${err.message}</div>`;
            }
        });
    </script>
</body>
</html>
