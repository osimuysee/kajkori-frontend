<div class="profile-container">
    <div class="profile-card">
        <!-- প্রোফাইল পিকচার ও স্ট্যাটাস -->
        <div class="profile-header">
            <div class="avatar-box">
                <!-- জিমেইল বা ইউজারের ছবি এখানে অটো শো করবে -->
                <img id="user-avatar" src="https://via.placeholder.com/150" alt="Profile Picture" class="profile-img">
                <span class="online-dot"></span>
            </div>
            <h2 id="user-name">লোডিং...</h2>
            <p id="user-email" class="user-email">email@example.com</p>
        </div>

        <!-- ইউজারের জাবতীয় তথ্য ও কন্টেন্ট দেখার সেকশন -->
        <div class="profile-body">
            <h3>আপনার কার্যক্রম ও তথ্য</h3>
            <div class="info-list" id="user-activity-list">
                <!-- ডায়নামিকভাবে ইউজারের সাবমিট করা ডাটা বা হিস্ট্রি এখানে দেখাবে -->
                <div class="info-item">
                    <span>জয়েনিং স্ট্যাটাস:</span>
                    <span class="highlight">অ্যাক্টিভ মেম্বার</span>
                </div>
                <div class="info-item">
                    <span>সংরক্ষিত আইটেম:</span>
                    <span id="saved-items-count">০টি</span>
                </div>
            </div>
            
            <button id="logout-btn" class="logout-btn">লগআউট করুন</button>
        </div>
    </div>
</div>
